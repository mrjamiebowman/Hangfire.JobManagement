<script setup lang="ts">

    const { createApp, ref } = Vue

    const app = createApp({
        data() {
            return {
                notifications: null,
                pagination: {
                    parPage: 10,
                    currentPage: 1
                }
            }
        },
        methods: {
            GetJobs() {
                axios.get('GetJobsStopped')
                     .then(res => (this.notifications = res.data))
            },
            clickCallbackPagination(pageNum) {
                let page = Number(pageNum);
                if (page < 1 || page > this.getPageCount) return;
                this.pagination.currentPage = page;
            }
        },
        created() {
            this.GetJobs();
        },
        computed: {
            getItems: function () {
                let current = this.pagination.currentPage * this.pagination.parPage;
                let start = current - this.pagination.parPage;

                if (this.notifications != null) {
                    return this.notifications.slice(start, current);
                } else {
                    return null;
                }
            },
            getPageCount: function () {
                return this.notifications != null ? Math.ceil(this.notifications.length / this.pagination.parPage) : 0;
            },
            // page numbers to show: first, last and a window around the current page; null = gap
            getPages: function () {
                let total = this.getPageCount;
                let current = this.pagination.currentPage;
                let pages = [];
                let last = 0;
                for (let page = 1; page <= total; page++) {
                    if (page === 1 || page === total || Math.abs(page - current) <= 2) {
                        if (page - last > 1) pages.push(null);
                        pages.push(page);
                        last = page;
                    }
                }
                return pages;
            }
        }
    });

</script>
