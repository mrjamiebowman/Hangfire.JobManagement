        <!-- job stopped -->
    </div>
    <div class="col-md-9">
        <h1 id="page-title" class="page-header">Stopped Jobs</h1>
        
        <div v-if="jobs.length == 0" class="alert alert-info">
            No jobs found in stopped state.
        </div>

        <div v-else class="js-jobs-list">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Queue</th>
                            <th>Class</th>
                            <th>Method</th>
                            <th class="align-right">Time Zone</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="job in getItems">
                            <td>{{job.Id}}</td>
                            <td>{{job.Queue}}</td>
                            <td>{{job.Class}}</td>
                            <td>{{job.Method}}</td>
                            <td class="min-width align-right">{{job.TimeZoneId}}</td>
                        </tr>
                    </tbody>
                </table>

                <div class="btn-toolbar" v-if="getPageCount > 1">
                    <div class="btn-group paginator">
                        <a href="#" class="btn btn-default" :class="{ disabled: pagination.currentPage <= 1 }"
                           @click.prevent="clickCallbackPagination(pagination.currentPage - 1)">
                            Prev
                        </a>
                        <template v-for="(page, index) in getPages" :key="index">
                            <a v-if="page === null" href="#" class="btn btn-default disabled" @click.prevent>
                                &hellip;
                            </a>
                            <a v-else href="#" class="btn btn-default" :class="{ active: page === pagination.currentPage }"
                               @click.prevent="clickCallbackPagination(page)">
                                {{page}}
                            </a>
                        </template>
                        <a href="#" class="btn btn-default" :class="{ disabled: pagination.currentPage >= getPageCount }"
                           @click.prevent="clickCallbackPagination(pagination.currentPage + 1)">
                            Next
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- app -->

<script setup lang="ts">

    const { createApp, ref } = Vue

    const app = createApp({
        data() {
            return {
                jobs: null,
                pagination: {
                    parPage: 10,
                    currentPage: 1
                }
            }
        },
        methods: {
            GetJobs() {
                axios.get('GetJobsStopped')
                     .then(res => (this.jobs = res.data))
            },
            clickCallbackPagination(pageNum) {
                let page = Number(pageNum);
                if (page < 1 || page > this.getPageCount) return;
                this.pagination.currentPage = page;
            }
        },
        created() {
            this.GetJobs();
        },
        computed: {
            getItems: function () {
                let current = this.pagination.currentPage * this.pagination.parPage;
                let start = current - this.pagination.parPage;
                if (this.jobs != null) return this.jobs.slice(start, current);
                else return null;
            },
            getPageCount: function () {
                return this.jobs != null ? Math.ceil(this.jobs.length / this.pagination.parPage) : 0;
            },
            // page numbers to show: first, last and a window around the current page; null = gap
            getPages: function () {
                let total = this.getPageCount;
                let current = this.pagination.currentPage;
                let pages = [];
                let last = 0;
                for (let page = 1; page <= total; page++) {
                    if (page === 1 || page === total || Math.abs(page - current) <= 2) {
                        if (page - last > 1) pages.push(null);
                        pages.push(page);
                        last = page;
                    }
                }
                return pages;
            }
        }
    });

    app.mount('#appSidebar');

</script>
